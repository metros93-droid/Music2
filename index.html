<!DOCTYPE html>
<html lang="ko" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070913">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="뮤직 플레이어">
    
    <!-- Neon Gradient App Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2306b6d4'/><stop offset='50%' stop-color='%23a855f7'/><stop offset='100%' stop-color='%23ec4899'/></linearGradient></defs><rect width='512' height='512' rx='120' fill='%23070913'/><rect x='16' y='16' width='480' height='480' rx='108' fill='url(%23bg)' opacity='0.15'/><path d='M192 144 L368 256 L192 368 Z' fill='url(%23bg)'/><circle cx='380' cy='140' r='12' fill='%2322d3ee'/><circle cx='130' cy='370' r='16' fill='%23e879f9'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2306b6d4'/><stop offset='50%' stop-color='%23a855f7'/><stop offset='100%' stop-color='%23ec4899'/></linearGradient></defs><rect width='512' height='512' rx='120' fill='%23070913'/><rect x='16' y='16' width='480' height='480' rx='108' fill='url(%23bg)' opacity='0.15'/><path d='M192 144 L368 256 L192 368 Z' fill='url(%23bg)'/><circle cx='380' cy='140' r='12' fill='%2322d3ee'/><circle cx='130' cy='370' r='16' fill='%23e879f9'/></svg>">
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22모바일%20뮤직%20플레이어%22,%22short_name%22:%22뮤직플레이어%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%23070913%22,%22theme_color%22:%22%23070913%22}">
    
    <title>모바일 뮤직 플레이어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root, html, body {
            background-color: #070913 !important;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Prevent side bouncing or horizontal scrolling */
        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Custom Styles for Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #22d3ee;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 12px #22d3ee, 0 0 20px #a855f7;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        /* Disc Animation & Neon Ring */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 14s linear infinite;
        }
        .paused-spin {
            animation-play-state: paused;
        }

        .neon-ring-outer {
            padding: 4px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #06b6d4, #a855f7, #ec4899);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4), 0 0 50px rgba(168, 85, 247, 0.3);
            transition: box-shadow 0.5s ease;
        }
        .neon-ring-outer.playing {
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.6), 0 0 70px rgba(236, 72, 153, 0.5);
        }

        /* Playlist Overlay Transition (Right to Left Slide) */
        .playlist-open {
            transform: translateX(0%);
        }
        .playlist-closed {
            transform: translateX(100%);
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .mask-image-y {
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        /* Lyrics Highlight Styles */
        .lyric-line { 
            transition: all 0.3s ease; 
            transform-origin: center;
        }
        .lyric-active { 
            color: #22d3ee; 
            font-weight: 700; 
            transform: scale(1.12); 
            text-shadow: 0 0 12px rgba(34, 211, 238, 0.6), 0 0 20px rgba(232, 121, 249, 0.4);
        }
    </style>
</head>
<body class="font-sans h-full w-full overflow-hidden flex flex-col justify-between relative bg-[#070913] max-w-[440px] mx-auto border-x border-white/5">

    <!-- Ambient Glow Background Blur -->
    <div class="absolute -top-24 -left-24 w-72 h-72 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-fuchsia-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Bar Header -->
    <header class="flex justify-between items-center px-6 py-3 bg-transparent z-10 w-full flex-shrink-0 pt-[calc(0.75rem+env(safe-area-inset-top))]">
        <div class="flex items-center gap-3">
            <button id="btnLoadMusic" class="text-gray-300 hover:text-white transition-all p-2.5 rounded-full backdrop-blur-md bg-white/5 border border-white/10 hover:border-cyan-500/50" title="음악 추가">
                <i class="fas fa-folder-plus text-lg"></i>
            </button>
            <button id="btnInstallApp" class="text-cyan-400 hover:text-cyan-300 transition-all p-2.5 rounded-full backdrop-blur-md bg-white/5 border border-white/10 flex items-center justify-center" title="홈 화면에 설치">
                <i class="fas fa-mobile-screen-button text-lg"></i>
            </button>
        </div>
        <span class="text-xs font-bold tracking-widest text-cyan-400/80 uppercase">Now Playing</span>
        <button id="btnTogglePlaylist" class="text-gray-300 hover:text-white transition-all p-2.5 rounded-full backdrop-blur-md bg-white/5 border border-white/10 hover:border-cyan-500/50 relative">
            <i class="fas fa-list-ul text-lg"></i>
            <span id="playlistBadge" class="absolute -top-1 -right-1 bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden shadow-lg shadow-cyan-500/50">0</span>
        </button>
    </header>

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" multiple accept="audio/*" class="hidden">

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-evenly px-6 w-full min-h-0 relative z-10 overflow-hidden">
        
        <!-- Visual Area (Vinyl + Gradient Neon Ring) -->
        <div class="relative w-full flex-1 max-h-[300px] flex items-center justify-center my-auto">
            <div id="neonRing" class="neon-ring-outer w-full max-w-[220px] aspect-square">
                <div class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center p-1 border border-white/10 cursor-pointer shadow-2xl relative" id="discContainer">
                    <div id="vinylDisc" class="w-full h-full rounded-full bg-slate-950 flex items-center justify-center paused-spin relative overflow-hidden">
                        <!-- Album Cover Image -->
                        <img id="albumCover" src="" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-500 z-10" alt="Album Cover" style="display: none;">
                        <!-- Default Vinyl Grooves -->
                        <div class="w-full h-full rounded-full border border-white/5 flex items-center justify-center">
                            <div class="w-3/4 h-3/4 rounded-full border border-white/5 flex items-center justify-center">
                                <div class="w-1/2 h-1/2 rounded-full border border-white/10 bg-cyan-500/10 flex items-center justify-center">
                                    <div class="w-4 h-4 rounded-full bg-cyan-400/60 shadow-[0_0_10px_#22d3ee]"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rectangular Lyrics Overlay -->
            <div id="inlineLyricsView" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[92%] h-[260px] bg-slate-950/40 backdrop-blur-md rounded-3xl z-30 flex flex-col hidden opacity-0 transition-opacity duration-300 overflow-hidden shadow-2xl border border-white/10 cursor-pointer">
                <div id="lyricsScroll" class="w-full h-full overflow-y-auto no-scrollbar relative px-4 mask-image-y pointer-events-auto">
                    <div id="lyricsContent" class="text-center text-gray-200 text-base sm:text-lg py-[110px] relative font-medium">
                        가사 정보를 불러오는 중입니다...
                    </div>
                </div>
            </div>
        </div>

        <!-- Song Info -->
        <div class="text-center w-full flex-shrink-0 my-2">
            <h2 id="songTitle" class="text-lg sm:text-xl font-bold truncate mb-1 text-white tracking-wide">음악을 선택해주세요</h2>
            <p id="songArtist" class="text-gray-400 text-xs sm:text-sm font-medium">기기의 폴더에서 노래를 불러오세요</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full flex-shrink-0 px-2 my-2">
            <input type="range" id="progressBar" min="0" value="0" step="0.1" class="w-full" disabled>
            <div class="flex justify-between text-[11px] text-gray-400 mt-1.5 font-mono">
                <span id="currentTime">00:00</span>
                <span id="totalTime">00:00</span>
            </div>
        </div>
    </main>

    <!-- Controls Area (Always Visible at Bottom) -->
    <div id="playerControls" class="flex justify-between items-center w-full px-8 pb-[calc(1.25rem+env(safe-area-inset-bottom))] pt-2 z-50 flex-shrink-0 bg-[#070913]">
        <button id="btnShuffle" class="text-gray-500 transition-colors p-2 focus:outline-none" title="셔플">
            <i class="fas fa-random text-base"></i>
        </button>
        <button id="btnPrev" class="text-gray-300 hover:text-cyan-400 transition-colors p-2 focus:outline-none" title="이전 곡 (뒤로 가기)">
            <i class="fas fa-step-backward text-xl"></i>
        </button>
        <button id="btnPlayPause" class="bg-gradient-to-r from-cyan-500 via-fuchsia-500 to-pink-500 hover:opacity-90 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.5)] focus:outline-none transition-transform transform active:scale-95" title="재생 / 일시정지">
            <i id="playPauseIcon" class="fas fa-play text-lg ml-0.5"></i>
        </button>
        <button id="btnNext" class="text-gray-300 hover:text-cyan-400 transition-colors p-2 focus:outline-none" title="다음 곡 (앞으로 가기)">
            <i class="fas fa-step-forward text-xl"></i>
        </button>
        <button id="btnRepeat" class="text-gray-500 transition-colors p-2 focus:outline-none relative" title="반복 설정">
            <i class="fas fa-redo text-base"></i>
            <span id="repeatOneBadge" class="absolute top-1 right-0 text-[8px] bg-cyan-400 text-slate-950 font-bold rounded-full w-3 h-3 flex items-center justify-center hidden">1</span>
        </button>
    </div>

    <!-- Playlist Overlay (Sized to keep controls visible at bottom) -->
    <div id="playlistView" class="absolute inset-x-0 top-0 bottom-[95px] bg-slate-950/95 backdrop-blur-xl border-b border-white/10 rounded-b-3xl shadow-2xl z-40 transition-transform duration-300 ease-in-out playlist-closed flex flex-col pt-[calc(0.5rem+env(safe-area-inset-top))]">
        <div class="flex justify-between items-center px-5 py-3.5 border-b border-white/10 shrink-0">
            <h3 class="text-base font-bold text-white">플레이리스트 (<span id="playlistCount" class="text-cyan-400">0</span>)</h3>
            <div class="flex gap-3 items-center">
                <button id="btnClearPlaylistBtn" class="text-rose-400 hover:text-rose-300 text-xs focus:outline-none px-2 py-1">비우기</button>
                <button id="btnClosePlaylist" class="text-gray-400 hover:text-white focus:outline-none px-2">
                    <i class="fas fa-chevron-up text-lg"></i>
                </button>
            </div>
        </div>
        
        <ul id="playlistContainer" class="flex-1 overflow-y-auto p-3 no-scrollbar">
            <li id="loadingIndicator" class="p-4 text-center text-gray-400 mt-10">
                <i class="fas fa-spinner fa-spin text-2xl mb-3 text-cyan-400"></i>
                <p class="text-xs">데이터를 불러오는 중입니다...</p>
            </li>
        </ul>
    </div>

    <!-- Backdrop for playlist -->
    <div id="playlistBackdrop" class="absolute inset-0 bg-black/60 z-30 hidden transition-opacity opacity-0 backdrop-blur-sm pointer-events-none"></div>

    <!-- Install Modal -->
    <div id="installModal" class="absolute inset-0 bg-black/80 z-50 hidden items-center justify-center backdrop-blur-sm opacity-0 transition-opacity">
        <div class="bg-slate-900 p-6 rounded-2xl w-[88%] max-w-xs text-center shadow-2xl border border-white/10 transform scale-95 transition-transform" id="installModalBox">
            <div class="w-14 h-14 mx-auto mb-3 rounded-2xl overflow-hidden shadow-lg border border-cyan-500/30 flex items-center justify-center bg-slate-950">
                <i class="fas fa-compact-disc text-2xl text-cyan-400 animate-spin-slow"></i>
            </div>
            <h4 class="text-base font-bold mb-1 text-white">홈 화면에 앱 설치</h4>
            <p class="text-[11px] text-gray-400 mb-4">GitHub Pages 등에서 어플처럼 간편하게 실행할 수 있습니다.</p>
            
            <button id="btnTriggerInstall" class="w-full py-2.5 mb-3 rounded-xl bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/30 hidden">
                <i class="fas fa-download"></i> 지금 바로 설치
            </button>

            <div class="text-left bg-slate-950/70 p-3 rounded-xl text-[11px] text-gray-300 space-y-2 border border-white/5 mb-4">
                <div>
                    <p class="font-semibold text-cyan-400 mb-0.5"><i class="fab fa-apple mr-1"></i> iOS (Safari):</p>
                    <p class="text-gray-300">하단 <i class="fas fa-share-from-square text-cyan-400"></i> (공유) 클릭 후 <strong class="text-white">'홈 화면에 추가'</strong></p>
                </div>
                <div class="border-t border-white/10 pt-1.5">
                    <p class="font-semibold text-cyan-400 mb-0.5"><i class="fab fa-android mr-1"></i> Android (Chrome):</p>
                    <p class="text-gray-300">우측 상단 <i class="fas fa-ellipsis-vertical text-cyan-400"></i> 클릭 후 <strong class="text-white">'앱 설치'</strong> 선택</p>
                </div>
            </div>

            <button id="btnCloseInstall" class="w-full py-2 rounded-xl bg-slate-800 text-gray-300 text-xs font-medium hover:bg-slate-700">닫기</button>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="absolute inset-0 bg-black/80 z-50 hidden items-center justify-center backdrop-blur-sm opacity-0 transition-opacity">
        <div class="bg-slate-900 p-5 rounded-2xl w-[82%] max-w-xs text-center shadow-2xl border border-white/10 transform scale-95 transition-transform" id="confirmModalBox">
            <div class="text-rose-400 mb-3 text-3xl">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h4 class="text-base font-bold mb-1 text-white">플레이리스트 비우기</h4>
            <p class="text-gray-400 text-xs mb-5">목록의 모든 곡이 삭제됩니다.<br>계속하시겠습니까?</p>
            <div class="flex gap-2.5 justify-center text-xs">
                <button id="btnCancelClear" class="px-3 py-2.5 rounded-xl bg-slate-800 text-white font-medium hover:bg-slate-700 flex-1">취소</button>
                <button id="btnConfirmClear" class="px-3 py-2.5 rounded-xl bg-rose-500 text-white font-medium hover:bg-rose-600 flex-1">비우기</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastMsg" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-slate-800/90 backdrop-blur-md text-cyan-300 px-4 py-2 rounded-full shadow-xl z-50 transition-opacity opacity-0 pointer-events-none text-xs border border-cyan-500/30 text-center max-w-[85vw]">
        알림 메시지
    </div>

    <script>
        // --- State Management ---
        const state = {
            playlist: [],
            currentIndex: -1,
            audio: new Audio(),
            isPlaying: false,
            isShuffle: false,
            repeatMode: 0,
            isDragging: false,
            parsedLyrics: [],
            pendingSeekTime: 0
        };

        // --- DOM Elements ---
        const DOM = {
            fileInput: document.getElementById('fileInput'),
            btnLoadMusic: document.getElementById('btnLoadMusic'),
            btnInstallApp: document.getElementById('btnInstallApp'),
            btnTogglePlaylist: document.getElementById('btnTogglePlaylist'),
            btnClosePlaylist: document.getElementById('btnClosePlaylist'),
            btnClearPlaylistBtn: document.getElementById('btnClearPlaylistBtn'),
            playlistView: document.getElementById('playlistView'),
            playlistBackdrop: document.getElementById('playlistBackdrop'),
            playlistContainer: document.getElementById('playlistContainer'),
            playlistCount: document.getElementById('playlistCount'),
            playlistBadge: document.getElementById('playlistBadge'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            
            songTitle: document.getElementById('songTitle'),
            songArtist: document.getElementById('songArtist'),
            currentTime: document.getElementById('currentTime'),
            totalTime: document.getElementById('totalTime'),
            progressBar: document.getElementById('progressBar'),
            
            btnPlayPause: document.getElementById('btnPlayPause'),
            playPauseIcon: document.getElementById('playPauseIcon'),
            btnPrev: document.getElementById('btnPrev'),
            btnNext: document.getElementById('btnNext'),
            btnShuffle: document.getElementById('btnShuffle'),
            btnRepeat: document.getElementById('btnRepeat'),
            repeatOneBadge: document.getElementById('repeatOneBadge'),
            
            neonRing: document.getElementById('neonRing'),
            discContainer: document.getElementById('discContainer'),
            vinylDisc: document.getElementById('vinylDisc'),
            albumCover: document.getElementById('albumCover'),
            
            inlineLyricsView: document.getElementById('inlineLyricsView'),
            lyricsScroll: document.getElementById('lyricsScroll'),
            lyricsContent: document.getElementById('lyricsContent'),
            
            confirmModal: document.getElementById('confirmModal'),
            confirmModalBox: document.getElementById('confirmModalBox'),
            btnCancelClear: document.getElementById('btnCancelClear'),
            btnConfirmClear: document.getElementById('btnConfirmClear'),
            
            installModal: document.getElementById('installModal'),
            installModalBox: document.getElementById('installModalBox'),
            btnTriggerInstall: document.getElementById('btnTriggerInstall'),
            btnCloseInstall: document.getElementById('btnCloseInstall'),
            
            toastMsg: document.getElementById('toastMsg')
        };

        let deferredPrompt = null;

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Registration:', err));
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            DOM.btnTriggerInstall.classList.remove('hidden');
        });

        function showInstallModal() {
            DOM.installModal.classList.remove('hidden');
            DOM.installModal.classList.add('flex');
            setTimeout(() => {
                DOM.installModal.classList.remove('opacity-0');
                DOM.installModalBox.classList.remove('scale-95');
                DOM.installModalBox.classList.add('scale-100');
            }, 10);
        }

        function hideInstallModal() {
            DOM.installModal.classList.add('opacity-0');
            DOM.installModalBox.classList.remove('scale-100');
            DOM.installModalBox.classList.add('scale-95');
            setTimeout(() => {
                DOM.installModal.classList.add('hidden');
                DOM.installModal.classList.remove('flex');
            }, 300);
        }

        DOM.btnInstallApp.addEventListener('click', showInstallModal);
        DOM.btnCloseInstall.addEventListener('click', hideInstallModal);

        DOM.btnTriggerInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    showToast('앱 설치를 시작합니다');
                }
                deferredPrompt = null;
                DOM.btnTriggerInstall.classList.add('hidden');
                hideInstallModal();
            }
        });

        // --- Touch Gestures (Swipe Left to Open Playlist, Swipe Right to Close) ---
        let touchStartX = 0;
        let touchStartY = 0;

        document.body.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.body.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // Ensure horizontal swipe is dominant
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                const isPlaylistOpen = DOM.playlistView.classList.contains('playlist-open');
                if (diffX < 0 && !isPlaylistOpen) {
                    // Swipe Left -> Open Playlist
                    togglePlaylist(true);
                } else if (diffX > 0 && isPlaylistOpen) {
                    // Swipe Right -> Close Playlist
                    togglePlaylist(false);
                }
            }
        }, { passive: true });

        // --- Media Session API ---
        function initMediaSession() {
            if (!('mediaSession' in navigator)) return;

            const actionHandlers = [
                ['play', () => { playTrack(); showToast("알림/이어폰: 재생"); }],
                ['pause', () => { pauseTrack(); showToast("알림/이어폰: 일시정지"); }],
                ['previoustrack', () => { prevTrack(); showToast("이어폰(3회 탭)/알림: 이전 곡"); }],
                ['nexttrack', () => { nextTrack(); showToast("이어폰(2회 탭)/알림: 다음 곡"); }],
                ['seekbackward', (details) => {
                    const skipTime = details.seekOffset || 10;
                    state.audio.currentTime = Math.max(state.audio.currentTime - skipTime, 0);
                }],
                ['seekforward', (details) => {
                    const skipTime = details.seekOffset || 10;
                    state.audio.currentTime = Math.min(state.audio.currentTime + skipTime, state.audio.duration || 0);
                }],
                ['seekto', (details) => {
                    if (details.seekTime !== undefined && !isNaN(details.seekTime)) {
                        state.audio.currentTime = details.seekTime;
                    }
                }]
            ];

            for (const [action, handler] of actionHandlers) {
                try {
                    navigator.mediaSession.setActionHandler(action, handler);
                } catch (err) {
                    console.warn(`MediaSession action ${action} not supported:`, err);
                }
            }
        }

        function updateMediaSession() {
            if (!('mediaSession' in navigator)) return;

            const currentTrack = state.currentIndex >= 0 ? state.playlist[state.currentIndex] : null;
            const title = currentTrack ? formatFileName(currentTrack.name) : '모바일 뮤직 플레이어';
            const artist = (currentTrack && DOM.songArtist.textContent && DOM.songArtist.textContent !== '기기의 폴더에서 노래를 불러오세요') 
                ? DOM.songArtist.textContent 
                : '모바일 플레이어';

            let artworkUrl = DOM.albumCover.src;
            if (!artworkUrl || DOM.albumCover.style.display === 'none') {
                artworkUrl = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23070913'/><path d='M192 144 L368 256 L192 368 Z' fill='%2322d3ee'/></svg>";
            }

            try {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: '내 플레이리스트',
                    artwork: [
                        { src: artworkUrl, sizes: '96x96', type: 'image/png' },
                        { src: artworkUrl, sizes: '128x128', type: 'image/png' },
                        { src: artworkUrl, sizes: '192x192', type: 'image/png' },
                        { src: artworkUrl, sizes: '256x256', type: 'image/png' },
                        { src: artworkUrl, sizes: '384x384', type: 'image/png' },
                        { src: artworkUrl, sizes: '512x512', type: 'image/png' }
                    ]
                });
            } catch (e) {
                console.warn('Metadata error:', e);
            }

            navigator.mediaSession.playbackState = state.isPlaying ? 'playing' : 'paused';
            updateMediaSessionPositionState();
        }

        function updateMediaSessionPositionState() {
            if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                if (state.audio.duration && !isNaN(state.audio.duration) && state.audio.duration > 0) {
                    try {
                        navigator.mediaSession.setPositionState({
                            duration: state.audio.duration,
                            playbackRate: state.audio.playbackRate || 1,
                            position: Math.min(Math.max(state.audio.currentTime || 0, 0), state.audio.duration)
                        });
                    } catch (e) {
                        console.warn('setPositionState error:', e);
                    }
                }
            }
        }

        // --- IndexedDB Persistence ---
        const DB_NAME = 'MobileMusicPlayerDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'playlist_tracks';
        let dbInstance = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                if (dbInstance) return resolve(dbInstance);
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveTracksToDB(trackObjects) {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            trackObjects.forEach(track => store.put(track));
            return new Promise((resolve, reject) => {
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function removeTrackFromDB(id) {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
            return new Promise(resolve => tx.oncomplete = () => resolve());
        }

        async function clearTracksDB() {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).clear();
            return new Promise(resolve => tx.oncomplete = () => resolve());
        }

        async function loadTracksFromDB() {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readonly');
            const request = tx.objectStore(STORE_NAME).getAll();
            return new Promise((resolve) => {
                request.onsuccess = () => resolve(request.result || []);
            });
        }

        // --- Settings Management ---
        function saveSettings() {
            const settings = {
                currentIndex: state.currentIndex,
                isShuffle: state.isShuffle,
                repeatMode: state.repeatMode,
                currentTime: state.audio ? state.audio.currentTime : 0
            };
            localStorage.setItem('musicPlayerSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem('musicPlayerSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.currentIndex = parsed.currentIndex !== undefined ? parsed.currentIndex : -1;
                    state.isShuffle = parsed.isShuffle || false;
                    state.repeatMode = parsed.repeatMode || 0;
                    state.pendingSeekTime = parsed.currentTime || 0;
                    updateShuffleUI();
                    updateRepeatUI();
                } catch (e) {
                    console.error("Setting load error", e);
                }
            }
        }

        function updateShuffleUI() {
            if (state.isShuffle) {
                DOM.btnShuffle.classList.remove('text-gray-500');
                DOM.btnShuffle.classList.add('text-cyan-400');
            } else {
                DOM.btnShuffle.classList.remove('text-cyan-400');
                DOM.btnShuffle.classList.add('text-gray-500');
            }
        }

        function showToast(msg) {
            DOM.toastMsg.textContent = msg;
            DOM.toastMsg.classList.remove('opacity-0');
            setTimeout(() => {
                DOM.toastMsg.classList.add('opacity-0');
            }, 2500);
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatFileName(filename) {
            return filename.replace(/\.[^/.]+$/, "");
        }

        // --- UI Updates ---
        function updatePlaylistUI() {
            DOM.playlistCount.textContent = state.playlist.length;
            
            if (state.playlist.length > 0) {
                DOM.playlistBadge.textContent = state.playlist.length;
                DOM.playlistBadge.classList.remove('hidden');
            } else {
                DOM.playlistBadge.classList.add('hidden');
            }
            
            if (state.playlist.length === 0) {
                DOM.playlistContainer.innerHTML = `
                    <li class="p-4 text-center text-gray-500 mt-10">
                        <div class="w-12 h-12 mx-auto bg-slate-900 rounded-full flex items-center justify-center mb-3 border border-white/10">
                            <i class="fas fa-music text-xl opacity-50 text-cyan-400"></i>
                        </div>
                        <p class="font-medium text-gray-300 text-sm">목록이 비어있습니다.</p>
                        <p class="text-xs mt-1 text-gray-500">좌측 상단의 폴더 아이콘을 눌러<br>음악을 추가하세요.</p>
                    </li>`;
                return;
            }

            DOM.playlistContainer.innerHTML = '';
            state.playlist.forEach((track, index) => {
                const isActive = index === state.currentIndex;
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-2.5 mb-2 rounded-xl cursor-pointer transition-colors ${isActive ? 'bg-cyan-500/10 border border-cyan-500/30' : 'hover:bg-slate-900/60'}`;
                
                li.innerHTML = `
                    <div class="flex items-center overflow-hidden flex-1">
                        <div class="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center mr-3 flex-shrink-0 border border-white/10 ${isActive ? 'text-cyan-400' : 'text-gray-500'}">
                            ${isActive && state.isPlaying ? '<i class="fas fa-chart-simple text-xs animate-pulse"></i>' : '<i class="fas fa-music text-xs"></i>'}
                        </div>
                        <div class="truncate pr-3">
                            <p class="truncate text-xs sm:text-sm font-medium ${isActive ? 'text-cyan-400 font-bold' : 'text-gray-200'}">${formatFileName(track.name)}</p>
                        </div>
                    </div>
                    <button class="text-gray-500 hover:text-rose-400 p-2 ml-1 delete-btn rounded-full hover:bg-slate-800" data-index="${index}">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                `;
                
                li.addEventListener('click', (e) => {
                    if(!e.target.closest('.delete-btn')) {
                        playTrack(index);
                        togglePlaylist(false);
                    }
                });

                const deleteBtn = li.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTrack(index);
                });

                DOM.playlistContainer.appendChild(li);
            });
        }

        function updateRepeatUI() {
            if (state.repeatMode === 0) {
                DOM.btnRepeat.classList.remove('text-cyan-400');
                DOM.btnRepeat.classList.add('text-gray-500');
                DOM.repeatOneBadge.classList.add('hidden');
            } else if (state.repeatMode === 1) {
                DOM.btnRepeat.classList.remove('text-gray-500');
                DOM.btnRepeat.classList.add('text-cyan-400');
                DOM.repeatOneBadge.classList.add('hidden');
            } else if (state.repeatMode === 2) {
                DOM.btnRepeat.classList.remove('text-gray-500');
                DOM.btnRepeat.classList.add('text-cyan-400');
                DOM.repeatOneBadge.classList.remove('hidden');
            }
        }

        function updatePlayPauseUI() {
            if (state.isPlaying) {
                DOM.playPauseIcon.className = 'fas fa-pause text-lg';
                DOM.vinylDisc.classList.remove('paused-spin');
                DOM.vinylDisc.classList.add('animate-spin-slow');
                DOM.neonRing.classList.add('playing');
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'playing';
                }
            } else {
                DOM.playPauseIcon.className = 'fas fa-play text-lg ml-0.5';
                DOM.vinylDisc.classList.add('paused-spin');
                DOM.neonRing.classList.remove('playing');
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'paused';
                }
            }
            updatePlaylistUI(); 
            updateMediaSession();
        }

        function resetUI() {
            DOM.songTitle.textContent = "음악을 선택해주세요";
            DOM.songArtist.textContent = "기기의 폴더에서 노래를 불러오세요";
            DOM.currentTime.textContent = "00:00";
            DOM.totalTime.textContent = "00:00";
            DOM.progressBar.value = 0;
            DOM.progressBar.disabled = true;
            DOM.albumCover.style.display = 'none';
            DOM.albumCover.src = '';
            DOM.lyricsContent.innerHTML = '가사 정보가 없습니다.';
            state.parsedLyrics = [];
            updatePlayPauseUI();
        }

        // --- Metadata Parsing ---
        function parseMetadata(file) {
            if (!window.jsmediatags) {
                DOM.lyricsContent.innerHTML = '<p class="text-gray-500">메타데이터 파서를 불러올 수 없습니다.</p>';
                return;
            }
            
            window.jsmediatags.read(file, {
                onSuccess: function(tag) {
                    const tags = tag.tags;
                    
                    if (tags.title) DOM.songTitle.textContent = tags.title;
                    if (tags.artist) DOM.songArtist.textContent = tags.artist;
                    
                    if (tags.picture) {
                        let base64String = "";
                        for (let i = 0; i < tags.picture.data.length; i++) {
                            base64String += String.fromCharCode(tags.picture.data[i]);
                        }
                        const base64 = "data:" + tags.picture.format + ";base64," + window.btoa(base64String);
                        DOM.albumCover.src = base64;
                        DOM.albumCover.style.display = 'block';
                        setTimeout(() => DOM.albumCover.classList.remove('opacity-0'), 50);
                    } else {
                        DOM.albumCover.style.display = 'none';
                        DOM.albumCover.src = '';
                    }
                    
                    state.parsedLyrics = [];
                    let lyricsText = "";
                    if (tags.lyrics) lyricsText = tags.lyrics.lyrics || tags.lyrics;
                    else if (tags.USLT) lyricsText = tags.USLT[0]?.text || tags.USLT.text || "";

                    if (typeof lyricsText === 'string' && lyricsText.trim().length > 0) {
                        parseLRC(lyricsText);
                    } else {
                        DOM.lyricsContent.innerHTML = '<p class="text-gray-500">등록된 가사 정보가 없습니다.</p>';
                    }
                    
                    updateMediaSession();
                },
                onError: function() {
                    DOM.albumCover.style.display = 'none';
                    DOM.albumCover.src = '';
                    DOM.lyricsContent.innerHTML = '<p class="text-gray-500">가사 정보를 읽을 수 없습니다.</p>';
                    updateMediaSession();
                }
            });
        }

        function parseLRC(text) {
            const lines = text.split('\n');
            state.parsedLyrics = [];
            let hasTimestamps = false;

            lines.forEach(line => {
                const timeMatches = [...line.matchAll(/\[(\d{2,}):(\d{2})(?:\.(\d{2,3}))?\]/g)];
                const textMatch = line.replace(/\[\d{2,}:\d{2}(?:\.\d{2,3})?\]/g, '').trim();

                if (timeMatches.length > 0) {
                    hasTimestamps = true;
                    timeMatches.forEach(m => {
                        const min = parseInt(m[1], 10);
                        const sec = parseInt(m[2], 10);
                        const ms = m[3] ? parseInt(m[3].padEnd(3, '0'), 10) : 0;
                        const timeInSeconds = (min * 60) + sec + (ms / 1000);
                        if (textMatch) state.parsedLyrics.push({ time: timeInSeconds, text: textMatch });
                    });
                }
            });

            if (hasTimestamps) {
                state.parsedLyrics.sort((a, b) => a.time - b.time);
                renderSyncedLyrics();
            } else {
                DOM.lyricsContent.innerHTML = lines.map(l => `<p class="mb-2">${l || '<br>'}</p>`).join('');
                state.parsedLyrics = [];
            }
        }

        function renderSyncedLyrics() {
            DOM.lyricsContent.innerHTML = '';
            state.parsedLyrics.forEach((lyric, index) => {
                const p = document.createElement('p');
                p.className = 'lyric-line mb-4 text-gray-400 cursor-pointer hover:text-gray-200 w-full break-words';
                p.style.lineHeight = '1.5';
                p.id = `lyric-${index}`;
                p.textContent = lyric.text;
                p.addEventListener('click', () => {
                    state.audio.currentTime = lyric.time;
                    if(!state.isPlaying) playTrack();
                });
                DOM.lyricsContent.appendChild(p);
            });
        }

        function updateLyricsHighlight(currentTime) {
            if (state.parsedLyrics.length === 0) return;
            let currentIndex = -1;
            for (let i = 0; i < state.parsedLyrics.length; i++) {
                if (currentTime >= state.parsedLyrics[i].time - 0.3) currentIndex = i;
                else break;
            }

            if (currentIndex !== state.lastLyricIndex) {
                document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('lyric-active'));
                if (currentIndex !== -1) {
                    const activeEl = document.getElementById(`lyric-${currentIndex}`);
                    if (activeEl) {
                        activeEl.classList.add('lyric-active');
                        if (!DOM.inlineLyricsView.classList.contains('hidden')) scrollToActiveLyric();
                    }
                }
                state.lastLyricIndex = currentIndex;
            }
        }

        // --- Core Audio Logic ---
        function loadTrack(index, autoPlay = true, seekTime = 0) {
            if (index < 0 || index >= state.playlist.length) return;
            
            const track = state.playlist[index];
            state.currentIndex = index;
            state.pendingSeekTime = seekTime;
            saveSettings();
            
            if (state.audio.src) URL.revokeObjectURL(state.audio.src);
            
            const objectUrl = URL.createObjectURL(track.file);
            state.audio.src = objectUrl;
            state.audio.load();
            
            DOM.songTitle.textContent = formatFileName(track.name);
            DOM.songArtist.textContent = "로딩 중...";
            DOM.albumCover.style.display = 'none';
            DOM.albumCover.classList.add('opacity-0');
            DOM.lyricsContent.innerHTML = '<p class="text-gray-500">정보 분석 중...</p>';
            state.parsedLyrics = [];
            state.lastLyricIndex = -1;
            
            parseMetadata(track.file);
            DOM.progressBar.disabled = false;
            updatePlaylistUI();
            
            if (autoPlay) playTrack(index);
        }

        function playTrack(index = null) {
            if (state.playlist.length === 0) return;
            if (index !== null && index !== state.currentIndex) loadTrack(index, false);
            else if (state.currentIndex === -1) loadTrack(0, false);
            
            state.audio.play().then(() => {
                state.isPlaying = true;
                updatePlayPauseUI();
            }).catch((err) => {
                console.warn("Playback prevented:", err);
                state.isPlaying = false;
                updatePlayPauseUI();
            });
        }

        function pauseTrack() {
            state.audio.pause();
            state.isPlaying = false;
            saveSettings();
            updatePlayPauseUI();
        }

        function togglePlayPause() {
            if (state.playlist.length === 0) {
                showToast("음악을 먼저 추가해주세요");
                return;
            }
            if (state.isPlaying) pauseTrack();
            else playTrack();
        }

        function nextTrack() {
            if (state.playlist.length === 0) return;
            if (state.isShuffle) {
                let nextIdx = state.currentIndex;
                while (nextIdx === state.currentIndex && state.playlist.length > 1) {
                    nextIdx = Math.floor(Math.random() * state.playlist.length);
                }
                playTrack(nextIdx);
            } else {
                let nextIdx = (state.currentIndex + 1) % state.playlist.length;
                playTrack(nextIdx);
            }
        }

        function prevTrack() {
            if (state.playlist.length === 0) return;
            if (state.audio.currentTime > 3) {
                state.audio.currentTime = 0;
            } else {
                let prevIdx = state.currentIndex - 1;
                if (prevIdx < 0) prevIdx = state.playlist.length - 1;
                playTrack(prevIdx);
            }
        }

        async function removeTrack(index) {
            const trackToRemove = state.playlist[index];
            state.playlist.splice(index, 1);
            await removeTrackFromDB(trackToRemove.id);

            if (index === state.currentIndex) {
                if (state.playlist.length === 0) {
                    pauseTrack();
                    state.audio.src = '';
                    state.currentIndex = -1;
                    resetUI();
                } else {
                    const nextIdx = index >= state.playlist.length ? 0 : index;
                    playTrack(nextIdx);
                }
            } else if (index < state.currentIndex) {
                state.currentIndex--;
            }
            saveSettings();
            updatePlaylistUI();
        }

        // --- Event Listeners ---
        let lastSavedSec = -1;

        state.audio.addEventListener('loadedmetadata', () => {
            DOM.totalTime.textContent = formatTime(state.audio.duration);
            DOM.progressBar.max = state.audio.duration;

            if (state.pendingSeekTime > 0 && state.pendingSeekTime < state.audio.duration) {
                state.audio.currentTime = state.pendingSeekTime;
                DOM.currentTime.textContent = formatTime(state.pendingSeekTime);
                DOM.progressBar.value = state.pendingSeekTime;
                updateLyricsHighlight(state.pendingSeekTime);
                state.pendingSeekTime = 0;
            }
            updateMediaSessionPositionState();
        });

        state.audio.addEventListener('timeupdate', () => {
            if (!state.isDragging) {
                DOM.currentTime.textContent = formatTime(state.audio.currentTime);
                DOM.progressBar.value = state.audio.currentTime;
            }

            const currentSec = Math.floor(state.audio.currentTime);
            if (currentSec !== lastSavedSec && state.currentIndex >= 0) {
                lastSavedSec = currentSec;
                saveSettings();
                updateMediaSessionPositionState();
            }

            updateLyricsHighlight(state.audio.currentTime);
        });

        state.audio.addEventListener('ended', () => {
            if (state.repeatMode === 2) {
                state.audio.currentTime = 0;
                playTrack(state.currentIndex);
            } else if (state.repeatMode === 0 && state.currentIndex === state.playlist.length - 1 && !state.isShuffle) {
                pauseTrack();
                state.audio.currentTime = 0;
            } else {
                nextTrack();
            }
        });

        DOM.progressBar.addEventListener('input', () => {
            state.isDragging = true;
            DOM.currentTime.textContent = formatTime(DOM.progressBar.value);
        });
        DOM.progressBar.addEventListener('change', () => {
            state.audio.currentTime = DOM.progressBar.value;
            state.isDragging = false;
            updateMediaSessionPositionState();
        });

        DOM.btnPlayPause.addEventListener('click', togglePlayPause);
        DOM.btnNext.addEventListener('click', nextTrack);
        DOM.btnPrev.addEventListener('click', prevTrack);

        DOM.btnShuffle.addEventListener('click', () => {
            state.isShuffle = !state.isShuffle;
            updateShuffleUI();
            saveSettings();
            showToast(state.isShuffle ? "셔플 켜짐" : "셔플 꺼짐");
        });

        function toggleLyrics() {
            const isHidden = DOM.inlineLyricsView.classList.contains('hidden');
            if (isHidden) {
                DOM.inlineLyricsView.classList.remove('hidden');
                setTimeout(() => {
                    DOM.inlineLyricsView.classList.remove('opacity-0');
                    scrollToActiveLyric();
                }, 10);
            } else {
                DOM.inlineLyricsView.classList.add('opacity-0');
                setTimeout(() => DOM.inlineLyricsView.classList.add('hidden'), 300);
            }
        }
        
        function scrollToActiveLyric() {
            if (state.lastLyricIndex !== -1 && state.lastLyricIndex !== undefined) {
                const activeEl = document.getElementById(`lyric-${state.lastLyricIndex}`);
                const scrollContainer = DOM.lyricsScroll;
                if (activeEl && scrollContainer) {
                    const containerRect = scrollContainer.getBoundingClientRect();
                    const activeRect = activeEl.getBoundingClientRect();
                    const offset = (activeRect.top - containerRect.top) + scrollContainer.scrollTop - (scrollContainer.clientHeight / 2) + (activeRect.height / 2);
                    scrollContainer.scrollTo({ top: offset, behavior: 'smooth' });
                }
            }
        }
        
        DOM.discContainer.addEventListener('click', toggleLyrics);
        DOM.inlineLyricsView.addEventListener('click', toggleLyrics);

        DOM.btnRepeat.addEventListener('click', () => {
            state.repeatMode = (state.repeatMode + 1) % 3;
            updateRepeatUI();
            saveSettings();
            const msgs = ["반복 꺼짐", "전체 반복", "한 곡 반복"];
            showToast(msgs[state.repeatMode]);
        });

        DOM.btnLoadMusic.addEventListener('click', () => DOM.fileInput.click());

        DOM.fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(file => file.type.startsWith('audio/'));
            if (files.length === 0) return;

            const wasEmpty = state.playlist.length === 0;
            const newTracks = files.map(file => ({
                id: Date.now() + '_' + Math.random().toString(36).substring(2, 9) + '_' + file.name,
                name: file.name,
                file: file
            }));

            state.playlist = [...state.playlist, ...newTracks];
            
            try {
                await saveTracksToDB(newTracks);
                showToast(`${newTracks.length}곡 추가 완료`);
            } catch (err) {
                showToast("저장소 저장 오류 발생");
            }

            updatePlaylistUI();

            if (wasEmpty) {
                loadTrack(0, false);
                DOM.songTitle.textContent = formatFileName(newTracks[0].name);
                DOM.songArtist.textContent = "재생 버튼을 눌러 시작하세요";
            }
            
            DOM.fileInput.value = '';
        });

        function togglePlaylist(forceState) {
            const isOpen = DOM.playlistView.classList.contains('playlist-open');
            const shouldOpen = forceState !== undefined ? forceState : !isOpen;

            if (!shouldOpen) {
                DOM.playlistView.classList.remove('playlist-open');
                DOM.playlistView.classList.add('playlist-closed');
                DOM.playlistBackdrop.classList.add('hidden');
                setTimeout(() => {
                    DOM.playlistBackdrop.classList.remove('opacity-100');
                    DOM.playlistBackdrop.classList.add('opacity-0');
                }, 10);
            } else {
                DOM.playlistView.classList.remove('playlist-closed');
                DOM.playlistView.classList.add('playlist-open');
                DOM.playlistBackdrop.classList.remove('hidden');
                setTimeout(() => {
                    DOM.playlistBackdrop.classList.remove('opacity-0');
                    DOM.playlistBackdrop.classList.add('opacity-100');
                }, 10);
            }
        }

        DOM.btnTogglePlaylist.addEventListener('click', () => togglePlaylist());
        DOM.btnClosePlaylist.addEventListener('click', () => togglePlaylist(false));

        function showConfirmModal() {
            if(state.playlist.length === 0) {
                showToast("비울 목록이 없습니다");
                return;
            }
            DOM.confirmModal.classList.remove('hidden');
            DOM.confirmModal.classList.add('flex');
            setTimeout(() => {
                DOM.confirmModal.classList.remove('opacity-0');
                DOM.confirmModalBox.classList.remove('scale-95');
                DOM.confirmModalBox.classList.add('scale-100');
            }, 10);
        }

        function hideConfirmModal() {
            DOM.confirmModal.classList.add('opacity-0');
            DOM.confirmModalBox.classList.remove('scale-100');
            DOM.confirmModalBox.classList.add('scale-95');
            setTimeout(() => {
                DOM.confirmModal.classList.add('hidden');
                DOM.confirmModal.classList.remove('flex');
            }, 300);
        }

        DOM.btnClearPlaylistBtn.addEventListener('click', showConfirmModal);
        DOM.btnCancelClear.addEventListener('click', hideConfirmModal);
        
        DOM.btnConfirmClear.addEventListener('click', async () => {
            hideConfirmModal();
            state.playlist = [];
            await clearTracksDB();
            
            pauseTrack();
            state.audio.src = '';
            state.currentIndex = -1;
            saveSettings();
            resetUI();
            updatePlaylistUI();
            showToast("플레이리스트가 초기화되었습니다");
        });

        // App Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            initMediaSession();
            try {
                loadSettings();
                const storedTracks = await loadTracksFromDB();
                
                if (storedTracks && storedTracks.length > 0) {
                    state.playlist = storedTracks;
                    updatePlaylistUI();
                    
                    if (state.currentIndex >= 0 && state.currentIndex < state.playlist.length) {
                        const savedTime = state.pendingSeekTime;
                        loadTrack(state.currentIndex, false, savedTime);
                        DOM.songArtist.textContent = "Offline Library (재개 대기중)";
                    } else {
                        state.currentIndex = -1;
                        resetUI();
                    }
                } else {
                    updatePlaylistUI();
                }
            } catch (error) {
                console.error("Initialization error:", error);
                DOM.loadingIndicator.innerHTML = '<p class="text-rose-400 text-xs">데이터를 불러오는데 실패했습니다.</p>';
            }
        });

        window.addEventListener('beforeunload', saveSettings);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') saveSettings();
        });
    </script>
</body>
</html>
